<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>🔐 加密笔记</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;
  padding:20px;

  background:#f5f7fb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.card{

  max-width:900px;

  margin:auto;

  background:#fff;

  border-radius:16px;

  padding:24px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.08);
}

h1{

  margin-top:0;
}

.tip{

  background:#eef5ff;

  color:#245;

  padding:14px;

  border-radius:10px;

  line-height:1.7;

  margin-bottom:20px;
}

.row{

  display:flex;

  gap:16px;

  flex-wrap:wrap;
}

.row > div{

  flex:1;
}

label{

  display:block;

  margin-top:16px;
  margin-bottom:8px;

  font-weight:600;
}

input,
select,
textarea,
button{

  width:100%;

  border:1px solid #d0d7e2;

  border-radius:10px;

  padding:12px;

  font-size:14px;
}

textarea{

  min-height:180px;

  resize:vertical;

  font-family:
    Consolas,
    monospace;
}

.actions{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-top:18px;
}

.actions button{

  flex:1;

  min-width:120px;
}

button{

  border:none;

  background:#2563eb;

  color:#fff;

  cursor:pointer;

  font-weight:600;

  transition:.2s;
}

button:hover{

  opacity:.92;
}

button.success{

  background:#16a34a;
}

button.secondary{

  background:#64748b;
}

.info{

  margin-top:18px;

  padding:12px;

  border-radius:10px;

  background:#f1f5f9;

  color:#334155;

  word-break:break-all;
}

@media(max-width:640px){

  .actions{

    flex-direction:column;
  }
}

</style>

</head>

<body>

<div class="card">

  <h1>🔐 加密笔记</h1>

  <div class="tip">
    所有加解密均在浏览器本地完成。<br>
    支持：<br>
    • 本地文件模式（离线可用）<br>
    • GitHub 仓库模式（自动同步）
  </div>

  <div class="row">

    <div>

      <label>模式</label>

      <select id="mode">

        <option value="local">
          本地文件模式
        </option>

        <option value="github">
          GitHub 仓库模式
        </option>

      </select>

    </div>

    <div id="githubFileArea">

      <label>仓库文件</label>

      <select id="fileList">

        <option value="">
          请选择文件
        </option>

      </select>

    </div>

  </div>

  <label>文件名</label>

  <input
    id="fileName"
    placeholder="例如：note1.json"
  >

  <div id="localArea">

    <label>导入本地文件</label>

    <input
      type="file"
      id="localFileInput"
    >

  </div>

  <label>
    输入内容（明文或密文 JSON）
  </label>

  <textarea id="input"></textarea>

  <label>密码</label>

  <input
    id="password"
    type="password"
    placeholder="请输入密码"
  >

  <div class="actions">

    <button onclick="encryptText()">
      加密并保存
    </button>

    <button onclick="saveCurrentText()">
      直接保存
    </button>

    <button
      class="success"
      onclick="decryptText()"
    >
      解密
    </button>

    <button
      class="secondary"
      onclick="copyOutput()"
    >
      复制结果
    </button>

  </div>

  <label>结果</label>

  <textarea
    id="output"
    readonly
  ></textarea>

  <div
    class="info"
    id="status"
  >
    正在初始化...
  </div>

</div>

<script>

let CONFIG = null;

const mode =
  document.getElementById("mode");

const input =
  document.getElementById("input");

const output =
  document.getElementById("output");

const fileName =
  document.getElementById("fileName");

const fileList =
  document.getElementById("fileList");

mode.addEventListener(
  "change",
  updateModeUI
);

function updateModeUI(){

  const githubMode =
    mode.value === "github";

  document.getElementById(
    "githubFileArea"
  ).style.display =
    githubMode
      ? "block"
      : "none";

  document.getElementById(
    "localArea"
  ).style.display =
    githubMode
      ? "none"
      : "block";
}

async function init(){

  updateModeUI();

  if(location.protocol === "file:"){

    setStatus(
      "✅ 当前为本地模式（离线）"
    );

    return;
  }

  try{

    const res =
      await fetch(
        "./config.json?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!res.ok){

      throw new Error(
        "config.json 不存在"
      );
    }

    CONFIG =
      await res.json();

    CONFIG.token =
      decodeToken(
        CONFIG.token_enc
      );

    setStatus(
      `✅ 已连接 GitHub：${CONFIG.owner}/${CONFIG.repo}`
    );

    mode.value = "github";

    updateModeUI();

    await loadFileList();

  }catch(e){

    console.error(e);

    setStatus(
      "⚠️ 未检测到 config.json，仅支持本地模式"
    );
  }
}

function decodeToken(enc){

  try{

    const data =
      enc
      .split("")
      .reverse()
      .join("");

    const raw =
      atob(data);

    return raw.replace(
      "github|pat|",
      "github_pat_"
    );

  }catch(e){

    throw new Error(
      "token 解码失败"
    );
  }
}

function bytesToBase64(bytes){

  let binary = "";

  bytes.forEach(
    b => {
      binary +=
        String.fromCharCode(b);
    }
  );

  return btoa(binary);
}

function base64ToBytes(base64){

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for(
    let i = 0;
    i < binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);
  }

  return bytes;
}

async function deriveKey(
  password,
  salt
){

  const enc =
    new TextEncoder();

  const keyMaterial =
    await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      {
        name:"PBKDF2"
      },
      false,
      ["deriveKey"]
    );

  return crypto.subtle.deriveKey(
    {
      name:"PBKDF2",
      salt,
      iterations:100000,
      hash:"SHA-256"
    },
    keyMaterial,
    {
      name:"AES-GCM",
      length:256
    },
    false,
    [
      "encrypt",
      "decrypt"
    ]
  );
}

async function encryptText(){

  try{

    const text =
      input.value;

    const password =
      getPassword();

    if(
      !text ||
      !password
    ){

      alert(
        "请输入内容和密码"
      );

      return;
    }

    const enc =
      new TextEncoder();

    const salt =
      crypto.getRandomValues(
        new Uint8Array(16)
      );

    const iv =
      crypto.getRandomValues(
        new Uint8Array(12)
      );

    const key =
      await deriveKey(
        password,
        salt
      );

    const encrypted =
      await crypto.subtle.encrypt(
        {
          name:"AES-GCM",
          iv
        },
        key,
        enc.encode(text)
      );

    const result = {

      v:1,

      salt:
        bytesToBase64(salt),

      iv:
        bytesToBase64(iv),

      data:
        bytesToBase64(
          new Uint8Array(
            encrypted
          )
        )
    };

    const json =
      JSON.stringify(
        result,
        null,
        2
      );

    output.value =
      json;

    if(
      mode.value === "github"
    ){

      if(!CONFIG){

        alert(
          "GitHub 未配置"
        );

        return;
      }

      await saveToGitHub(
        json
      );

    }else{

      downloadLocalFile(
        json
      );
    }

    setStatus(
      "✅ 加密完成"
    );

  }catch(e){

    alert(
      "加密失败：" +
      e.message
    );
  }
}

async function decryptText(){

  try{

    const content =
      input.value;

    const password =
      getPassword();

    if(
      !content ||
      !password
    ){

      alert(
        "请输入密文和密码"
      );

      return;
    }

    const obj =
      JSON.parse(content);

    const salt =
      base64ToBytes(
        obj.salt
      );

    const iv =
      base64ToBytes(
        obj.iv
      );

    const data =
      base64ToBytes(
        obj.data
      );

    const key =
      await deriveKey(
        password,
        salt
      );

    const decrypted =
      await crypto.subtle.decrypt(
        {
          name:"AES-GCM",
          iv
        },
        key,
        data
      );

    const dec =
      new TextDecoder();

    output.value =
      dec.decode(
        decrypted
      );

    setStatus(
      "✅ 解密成功"
    );

  }catch(e){

    alert(
      "解密失败：密码错误或密文损坏"
    );
  }
}

async function saveCurrentText(){

  try{

    const content =
      input.value;

    if(!content){

      alert(
        "没有可保存内容"
      );

      return;
    }

    if(
      mode.value === "github"
    ){

      if(!CONFIG){

        alert(
          "GitHub 未配置"
        );

        return;
      }

      await saveToGitHub(
        content
      );

    }else{

      downloadLocalFile(
        content
      );
    }

    setStatus(
      "✅ 文件已保存"
    );

  }catch(e){

    alert(
      "保存失败：" +
      e.message
    );
  }
}

async function saveToGitHub(
  content
){

  const path =
    fileName.value.trim();

  if(!path){

    alert(
      "请输入文件名"
    );

    return;
  }

  const api =
    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;

  let sha = null;

  const check =
    await fetch(
      api,
      {
        headers:{
          Authorization:
            `Bearer ${CONFIG.token}`
        }
      }
    );

  if(check.ok){

    const file =
      await check.json();

    sha =
      file.sha;
  }

  const res =
    await fetch(
      api,
      {
        method:"PUT",

        headers:{
          Authorization:
            `Bearer ${CONFIG.token}`,

          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          message:
            `update ${path}`,

          content:
            btoa(
              unescape(
                encodeURIComponent(
                  content
                )
              )
            ),

          sha
        })
      }
    );

  if(!res.ok){

    throw new Error(
      "GitHub 保存失败"
    );
  }

  await loadFileList();

  setStatus(
    "✅ 已保存到 GitHub"
  );
}

function downloadLocalFile(
  content
){

  const path =
    fileName.value.trim()
    || "encrypted.json";

  const blob =
    new Blob(
      [content],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    path;

  a.click();

  URL.revokeObjectURL(
    url
  );

  setStatus(
    "✅ 已下载到本地"
  );
}

async function loadFileList(){

  if(!CONFIG)
    return;

  const api =
    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;

  const res =
    await fetch(
      api,
      {
        headers:{
          Authorization:
            `Bearer ${CONFIG.token}`
        }
      }
    );

  if(!res.ok){

    throw new Error(
      "读取仓库失败"
    );
  }

  const files =
    await res.json();

  fileList.innerHTML =
    `
      <option value="">
        请选择文件
      </option>
    `;

  files.forEach(file=>{

    if(
      file.type !== "file"
    ) return;

    const option =
      document.createElement(
        "option"
      );

    option.value =
      file.path;

    option.innerText =
      file.name;

    fileList.appendChild(
      option
    );
  });
}

fileList.addEventListener(
  "change",

  async ()=>{

    const path =
      fileList.value;

    if(!path)
      return;

    fileName.value =
      path;

    const api =
      `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;

    const res =
      await fetch(
        api,
        {
          headers:{
            Authorization:
              `Bearer ${CONFIG.token}`
          }
        }
      );

    const file =
      await res.json();

    const content =
      decodeURIComponent(
        escape(
          atob(
            file.content
            .replace(
              /\n/g,
              ""
            )
          )
        )
      );

    input.value =
      content;

    setStatus(
      "✅ 文件已加载"
    );
  }
);

document
.getElementById(
  "localFileInput"
)
.addEventListener(
  "change",

  e=>{

    const file =
      e.target.files[0];

    if(!file)
      return;

    fileName.value =
      file.name;

    const reader =
      new FileReader();

    reader.onload =
      ev=>{

        input.value =
          ev.target.result;

        setStatus(
          "✅ 本地文件已加载"
        );
      };

    reader.readAsText(
      file
    );
  }
);

async function copyOutput(){

  const text =
    output.value;

  if(!text){

    alert(
      "没有可复制内容"
    );

    return;
  }

  await navigator
  .clipboard
  .writeText(text);

  setStatus(
    "✅ 已复制"
  );
}

function getPassword(){

  return document
    .getElementById(
      "password"
    )
    .value;
}

function setStatus(text){

  document
    .getElementById(
      "status"
    )
    .innerText =
      text;
}

init();

</script>

</body>
</html>
